name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --org com.arun --project-name pdf_maker_by_arun --platforms android .
      - run: |
          rm -rf test
          cp src/main.dart lib/main.dart
          cp src/pubspec.yaml pubspec.yaml
          sed -i 's/android:label="[^"]*"/android:label="PDF Maker By Arun"/' android/app/src/main/AndroidManifest.xml
      - name: Fixed signing key (agar debug.keystore repo me hai)
        run: |
          if [ -f debug.keystore ]; then
            mkdir -p ~/.android
            cp debug.keystore ~/.android/debug.keystore
          fi
      - name: Force compileSdk 36 for all plugins
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/force-sdk.gradle <<'EOF'
          allprojects {
            afterEvaluate { p ->
              def a = p.extensions.findByName('android')
              if (a != null) {
                try { a.compileSdk = 36 } catch (Throwable t) { }
              }
            }
          }
          EOF 
- name: Add ML Kit Chinese class required by R8
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            printf '\ndependencies { implementation("com.google.mlkit:text-recognition-chinese:16.0.1") }\n' >> android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            printf "\ndependencies { implementation 'com.google.mlkit:text-recognition-chinese:16.0.1' }\n" >> android/app/build.gradle
          else
            echo "Android app Gradle file not found"
            exit 1
          fi
      - run: flutter pub get
      - run: flutter build apk --release --no-shrink
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Maker-By-Arun
          path: build/app/outputs/flutter-apk/app-release.apk
