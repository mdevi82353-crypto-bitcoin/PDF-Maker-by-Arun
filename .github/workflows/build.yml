name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --org com.arun --project-name pdf_maker_by_arun --platforms android .
      - run: |
          rm -rf test
          cp src/main.dart lib/main.dart
          cp src/pubspec.yaml pubspec.yaml
          sed -i 's/android:label="[^"]*"/android:label="PDF Maker By Arun"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Maker-By-Arun
          path: build/app/outputs/flutter-apk/app-release.apk
